<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>📱 Daniel Rieder – Polizei Ganterbach</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#ece5dd;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
  display:flex;
  justify-content:center;
  padding:20px;
}
.phone{
  width:320px;
  height:600px;
  background:#e5ddd5;
  border-radius:30px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.header{
  background:#075e54;
  color:#fff;
  padding:14px;
  font-weight:600;
}
.subheader{
  font-size:12px;
  opacity:0.85;
}
.chat{
  flex:1;
  padding:12px;
  overflow-y:auto;
  background:#efeae2;
}
.msg{
  max-width:80%;
  padding:10px 12px;
  margin:6px 0;
  border-radius:10px;
  font-size:14px;
  line-height:1.4;
}
.user{
  background:#dcf8c6;
  margin-left:auto;
  border-bottom-right-radius:2px;
}
.polizei{
  background:#fff;
  margin-right:auto;
  border-bottom-left-radius:2px;
}
.input{
  display:flex;
  padding:10px;
  background:#f0f0f0;
}
input{
  flex:1;
  padding:10px 14px;
  border-radius:20px;
  border:none;
  outline:none;
}
button{
  margin-left:8px;
  border:none;
  border-radius:50%;
  background:#075e54;
  color:#fff;
  width:40px;
  height:40px;
  font-size:18px;
}
</style>
</head>

<body>

<div class="phone">
  <div class="header">
    Daniel Rieder 👮‍♂️
    <div class="subheader">Regionalpolizei Ganterbach · online</div>
  </div>

  <div id="chat" class="chat"></div>

  <div class="input">
    <input id="input" placeholder="Nachricht schreiben …">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
let voices=[];
speechSynthesis.onvoiceschanged=()=>voices=speechSynthesis.getVoices();

const chat=document.getElementById("chat");
const input=document.getElementById("input");

// ------------------------------
// Nachricht anzeigen + sprechen
// ------------------------------
function add(text,cls){
  const d=document.createElement("div");
  d.className="msg "+cls;
  d.innerText=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  if(cls==="polizei") speak(text);
}

// ------------------------------
// Männerstimme (ruhig, tief)
// ------------------------------
function speak(text){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE";

  const preferred = [
    "Markus",
    "Google Deutsch Male",
    "Google Deutsch",
    "Microsoft Stefan",
    "Microsoft Markus"
  ];

  const voice = voices.find(v =>
    preferred.some(name => v.name.includes(name))
  ) || voices.find(v => v.lang.startsWith("de"));

  if(voice) u.voice = voice;

  u.pitch = 0.4;   // tiefer = männlicher
  u.rate  = 0.65;  // ruhig & autoritär
  u.volume = 1;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// ------------------------------
// FINAL respond()
// ------------------------------
function respond(q){
  const t = q.toLowerCase();

  if(t.includes("hallo")||t.includes("hey")||t.includes("gruss"))
    return rand([
      "Ja hallo. Was gibt’s?",
      "Gruss. Ich bin dran.",
      "Hallo, sag mal.",
      "Ja, ich hör dich."
    ]);

  if(t.includes("danke"))
    return rand([
      "Gern geschehen.",
      "Kein Thema.",
      "Wir Walliser helfen einander.",
      "Dafür sind wir da."
    ]);

  if(t.includes("tschüss")||t.includes("ciao")||t.includes("bis"))
    return rand([
      "Bis später. Meld dich, wenn was ist.",
      "Tschüss. Funk ist offen.",
      "Bis dann.",
      "Ich bin erreichbar."
    ]);

  if(t.includes("mord"))
    return rand([
      "So weit sind wir offiziell noch nicht.",
      "Das ist im Moment noch offen.",
      "Stand jetzt sprechen wir von einem Todesfall.",
      "Findet ihr raus – wir bleiben sachlich."
    ]);

  if(t.includes("beweis")||t.includes("spur"))
    return rand([
      "Es gibt mehrere Spuren, nichts Abschließendes.",
      "Einige Funde müssen noch geprüft werden.",
      "Nicht jede Spur ist relevant.",
      "Wir sichern erst, bewerten später."
    ]);

  if(t.includes("wer")||t.includes("verdacht")||t.includes("täter"))
    return rand([
      "Stand jetzt ist niemand offiziell verdächtig.",
      "Wir hören uns alle Beteiligten an.",
      "Viele waren vor Ort.",
      "Auffälligkeiten gibt es mehrere."
    ]);

  if(t.includes("camping")||t.includes("ganterbach")||t.includes("zelt"))
    return rand([
      "Der Platz war gut besucht.",
      "Typischer Sommerbetrieb.",
      "Viele Leute, viel Bewegung.",
      "Nicht alles ist einsehbar."
    ]);

  if(t.includes("wann")||t.includes("zeit")||t.includes("uhr"))
    return rand([
      "Zeitangaben gehen auseinander.",
      "Viele orientieren sich nicht an der Uhr.",
      "Abends verschwimmt vieles.",
      "Das müssen wir noch eingrenzen."
    ]);

  if(t.includes("bericht")||t.includes("protokoll"))
    return rand([
      "Bericht ist in Arbeit.",
      "Geht heute noch raus.",
      "Details folgen schriftlich.",
      "Mündlich nur das Nötigste."
    ]);

  if(t.includes("passwort")||t.includes("login"))
    return rand([
      "Dazu sag ich nichts im Chat.",
      "Schau im Hilfe-Bereich nach.",
      "Zugänge laufen nicht über mich.",
      "Das ist sauber geregelt."
    ]);

  if(t.length<3)
    return "Kannst du das etwas genauer formulieren?";

  if(t.includes("😂")||t.includes("lol"))
    return "Ja… Humor hilft. Aber nicht immer.";

  return rand([
    "Dazu hab ich im Moment nichts Verlässliches.",
    "Das nehme ich so auf.",
    "Ich würde das nicht überbewerten.",
    "Lass uns bei den Fakten bleiben.",
    "Schreib ich mir auf."
  ]);
}

// ------------------------------
function rand(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

// ------------------------------
function send(){
  const text=input.value.trim();
  if(!text) return;
  input.value="";
  add(text,"user");
  setTimeout(()=>add(respond(text),"polizei"),600);
}
</script>

</body>
</html>
