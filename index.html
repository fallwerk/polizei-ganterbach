<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>📞 Polizei Ganterbach</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial, sans-serif; background:#111; color:#eee; padding:20px; }
#chat { max-width:600px; margin:auto; }
.msg { margin:10px 0; }
.polizei { color:#9ddcff; }
button { padding:10px; margin-top:10px; }
input { width:100%; padding:10px; margin-top:10px; }
</style>
</head>
<body>
<div id="chat">
  <h2>📞 Polizei Ganterbach</h2>
  <div id="messages"></div>
  <input id="input" placeholder="Ihre Frage an die Polizei">
  <button onclick="send()">Senden</button>
  <button onclick="playVoice()">🔊 Antwort anhören</button>
  <button onclick="speak()">🎤 Sprechen</button>
</div>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("input");
let chatHistory = [];
let lastPoliceText = "";

// Nachrichten ins Chatfenster
function add(text, cls){
  const d = document.createElement("div");
  d.className = "msg " + (cls || "");
  d.innerText = text;
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
  if(cls === "polizei") lastPoliceText = text;
}

// Krimi-spezifische Logik
function handleCrimeQuestions(userText) {
  const lower = userText.toLowerCase();

  // Passwort
  if(lower.includes("passwort")) {
    return "Schau am besten ins FAQ der Regionalpolizei-Website, da findet man solche Infos.";
  }

  // Verdächtige oder Hinweise
  if(lower.includes("verdächtige") || lower.includes("beweise") || lower.includes("tatzeit")) {
    return "Die Unterlagen und Verhöre findest du auf der Regionalpolizei-Website. Aber Vorsicht: nicht jeder Hinweis ist so harmlos wie ein Walliser Käse!";
  }

  // Wallis Humor
  const wallisJokes = [
    "Im Wallis ist sogar der Berg sicherer als manche Camper…",
    "Wer die Alpen liebt, hat manchmal mehr mit Kühen als mit Kriminellen zu tun!",
    "Die Sonne brennt hier so stark, dass selbst Hinweise manchmal schmelzen…",
    "Zwischen Matterhorn und Mordfall – so ist das Leben in den Bergen!"
  ];
  const joke = wallisJokes[Math.floor(Math.random() * wallisJokes.length)];

  return `Ernsthaft: ${joke}`;
}

// Nachricht an Worker/ChatGPT senden
async function send(){
  const text = input.value.trim();
  if(!text) return;
  add("Du: " + text);
  input.value = "";
  chatHistory.push({role:"user", content:text});

  // Wenn Krimi-spezifisch
  let responseText;
  const isCrimeQuestion = /camping|mord|ganterbach|verdächtige|beweise|tatzeit|passwort/i.test(text);

  if(isCrimeQuestion){
    responseText = handleCrimeQuestions(text);
  } else {
    // ChatGPT Worker Anfrage
    try {
      const r = await fetch("https://plain-sea-bb50.fallwerk-krimi.workers.dev/",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"gpt-4o-mini",
          messages: chatHistory
        })
      });
      if(!r.ok){ responseText = "❌ Fehler bei ChatGPT ("+r.status+")"; }
      else {
        const j = await r.json();
        responseText = j.choices[0].message.content;
      }
    } catch(e){
      responseText = "❌ Verbindung fehlgeschlagen";
    }
  }

  add("Jordan: " + responseText, "polizei");
  chatHistory.push({role:"assistant", content: responseText});
}

// iOS-optimierte Stimme
function playVoice() {
  if (!lastPoliceText) return;

  const utter = new SpeechSynthesisUtterance(lastPoliceText);
  utter.lang = "de-DE";
  utter.pitch = 0.6;
  utter.rate = 0.85;
  utter.volume = 1;

  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

// Spracheingabe
function speak(){
  if(!("webkitSpeechRecognition" in window)){
    alert("Spracherkennung wird nicht unterstützt.");
    return;
  }
  const r=new webkitSpeechRecognition();
  r.lang="de-DE";
  r.start();
  r.onresult=e=>{
    input.value=e.results[0][0].transcript;
    send();
  };
}
</script>
</body>
</html>
