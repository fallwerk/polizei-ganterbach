<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>📱 Daniel Rieder – Polizei Ganterbach</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#ece5dd;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
  display:flex;
  justify-content:center;
  padding:20px;
}
.phone{
  width:300px;
  height:560px;
  background:#e5ddd5;
  border-radius:30px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.header{
  background:#075e54;
  color:#fff;
  padding:14px;
  font-weight:600;
}
.subheader{
  font-size:12px;
  opacity:0.85;
}
.chat{
  flex:1;
  padding:12px;
  overflow-y:auto;
  background:#efeae2;
}
.msg{
  max-width:80%;
  padding:10px 12px;
  margin:6px 0;
  border-radius:10px;
  font-size:14px;
  line-height:1.4;
}
.user{
  background:#dcf8c6;
  margin-left:auto;
  border-bottom-right-radius:2px;
}
.polizei{
  background:#fff;
  margin-right:auto;
  border-bottom-left-radius:2px;
}
.input{
  display:flex;
  padding:10px;
  background:#f0f0f0;
}
input{
  flex:1;
  padding:10px 14px;
  border-radius:20px;
  border:none;
  outline:none;
}
button{
  margin-left:8px;
  border:none;
  border-radius:50%;
  background:#075e54;
  color:#fff;
  width:40px;
  height:40px;
  font-size:18px;
}
</style>
</head>

<body>

<div class="phone">
  <div class="header">
    Daniel Rieder 👮‍♂️
    <div id="status" class="subheader">Regionalpolizei Ganterbach · online</div>
  </div>

  <div id="chat" class="chat"></div>

  <div class="input">
    <input id="input" placeholder="Nachricht schreiben …">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
/* =========================
   STIMME (MÄNNLICH)
========================= */
let voices=[];
speechSynthesis.onvoiceschanged=()=>voices=speechSynthesis.getVoices();

function speak(text){
  if(!voices.length) voices = speechSynthesis.getVoices();

  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE";

  const malePriority = [
    "Markus",
    "Microsoft Stefan",
    "Microsoft Markus",
    "Google Deutsch Male",
    "Google Deutsch"
  ];

  const voice =
    voices.find(v=>malePriority.some(n=>v.name.includes(n)))
    || voices.find(v=>v.lang.startsWith("de"));

  if(voice) u.voice = voice;

  u.pitch = 0.35;
  u.rate  = 0.65;
  u.volume = 1;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* =========================
   CHAT BASIS
========================= */
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const status=document.getElementById("status");

function add(text,cls){
  const d=document.createElement("div");
  d.className="msg "+cls;
  d.innerText=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  if(cls==="polizei") speak(text);
}

function addSilent(text,cls){
  const d=document.createElement("div");
  d.className="msg "+cls;
  d.innerText=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

function typing(on=true){
  status.innerText = on
    ? "              · schreibt…"
    : "              · online";
}

/* =========================
   BETEILIGTE (JOBS)
========================= */
const persons={
  "thomas":"Thomas G. Brigger war Podcaster mit Fokus Umwelt, Tourismus und Gesellschaft.",
  "brigger":"Thomas G. Brigger war in der Region sehr präsent.",
  "doris":"Doris Bayard arbeitet in der Verwaltung des Campingplatzes.",
  "bayard":"Doris Bayard ist zuständig für Organisation und Abläufe.",
  "martin nanzer":"Martin Nanzer ist Dauercamper mit handwerklichem Hintergrund.",
  "nanzer":"Martin Nanzer hält sich oft länger auf dem Platz auf.",
  "stefanie":"Stefanie Schnydrig arbeitet im Social-Media-Bereich.",
  "steven":"Steven Amherd ist selbstständig und lebt zeitweise im Van.",
  "peter":"Peter Jossen war früher Gemeindepolizist.",
  "jossen":"Peter Jossen kennt Polizeiarbeit von früher.",
  "tina":"Tina Wolf engagiert sich im Naturschutz.",
  "fredy":"Fredy Näfen betreut technische Anlagen auf dem Campingplatz.",
  "näfen":"Fredy Näfen kennt sich mit Strom und Technik aus.",
  "nina":"Nina Bellwald arbeitet an der Rezeption.",
  "bellwald":"Nina Bellwald ist erste Anlaufstelle für Gäste.",
  "hans":"Hans Burri ist in der Region bekannt, oft an der Brücke.",
  "burri":"Hans Burri lebt zurückgezogen.",
  "martin bellwald":"Martin Bellwald ist politisch aktiv in der Region."
};

/* =========================
   ANTWORTLOGIK (1 PHASE)
========================= */
function respond(q){
  const t = q.toLowerCase();

  /* Forensik / Analyse */
  if(
    t.includes("forensik") ||
    t.includes("analyse") ||
    t.includes("todesursache") ||
    t.includes("obduktion") ||
    t.includes("gerichtsmedizin")
  ){
    return "Dazu kann ich hier nichts sagen. Schreibt der Forensik eine E-Mail, die präzisieren das sauber.";
  }

  /* Personen */
  for(const k in persons){
    if(t.includes(k)){
      return "Ja, kenn ich. "+persons[k]+"Mehr weiss ich nicht. Jetzt ist es euer Job hier mehr zu finden.";
    }
  }

  /* Fallbezogen */
  if(t.includes("mord")){
    return "Offiziell ist das noch nicht bestätigt. Wir bleiben bei den Fakten.";
  }

  if(t.includes("beweis") || t.includes("spur")){
    return "Es gibt mehrere Spuren. Keine erklärt alles für sich allein.";
  }

  if(t.includes("verdacht") || t.includes("wer")){
    return "Viele Menschen, viele Geschichten. Nicht jede passt zusammen.";
  }

  if(t.includes("wann") || t.includes("zeit")){
    return "Zeitangaben gehen auseinander. Ferien verzerren Erinnerungen.";
  }

  if(t.includes("wo") || t.includes("ort") || t.includes("camping")){
    return "Der Campingplatz ist größer und verwinkelter, als man denkt.";
  }

  /* Smalltalk */
  if(t.includes("wie geht") || t.includes("alles klar")){
    return "Soweit gut. Langer Tag, aber gehört dazu.";
  }

  if(t.includes("stress") || t.includes("viel los")){
    return "Sommer, Campingplatz, viele Leute – das erklärt einiges.";
  }

  if(t.includes("wallis")){
    return "Im Wallis sind wir eher ruhig. Das hier ist… untypisch.";
  }

  if(t.includes("kaffee") || t.includes("pause")){
    return "Ein Kaffee wäre jetzt definitiv angebracht.";
  }

  if(t.includes("danke")){
    return "Gern geschehen. Wir Walliser helfen einander.";
  }

  if(t.includes("tschüss") || t.includes("bis später")){
    return "Alles klar. Meld dich, wenn was ist.";
  }

  if(t.includes("hallo") || t.includes("hoi")){
    return "Hoi. Schreib einfach, ich bin den ganzen Tag erreichbar.";
  }

  if(t.includes("wetter")){
    return "Wenn das Wetter nicht umschlägt, bleibt es so. Und im Wallis ist immer schön.";
  }
  
  if(t.includes("radar")){
    return "Es gab in der Nähe eine Geschwindigkeitskontrolle. Fotos solltet ihr eigentlich finden.";
  }
  
  if(t.includes("passwort")){
    return "Dazu kann ich nichts sagen. Schau im Hilfe-Bereich der Polizei Webseite nach.";
  }

  /* Fallback */
  const fallback=[
    "Dazu hab ich aktuell nichts Belastbares.",
    "Das klären wir Schritt für Schritt.",
    "Schreib ich mir gedanklich auf.",
    "Das gehört eher in den Bericht.",
    "Im Moment behalten wir den Überblick."
  ];

  return fallback[Math.floor(Math.random()*fallback.length)];
}

/* =========================
   SENDEN
========================= */
function send(){
  const text=input.value.trim();
  if(!text) return;
  input.value="";
  add(text,"user");
  typing(true);
  setTimeout(()=>{
    typing(false);
    add(respond(text),"polizei");
  },900+Math.random()*1200);
}

/* =========================
   BEGRÜSSUNG (OHNE TON)
========================= */
window.onload=()=>{
  setTimeout(()=>{
    addSilent(
      "Hallo zusammen. Daniel Rieder hier. Ich war als Erster vor Ort beim Campingplatz Ganterbach. Wenn ihr Fragen habt – schreibt einfach.",
      "polizei"
    );
  },800);
};
</script>

</body>
</html>
