<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>📞 Polizei Ganterbach</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial, sans-serif; background:#111; color:#eee; padding:20px; }
#chat { max-width:600px; margin:auto; }
.msg { margin:10px 0; }
.polizei { color:#9ddcff; }
button { padding:10px; margin-top:10px; }
input { width:100%; padding:10px; margin-top:10px; }
</style>
</head>
<body>
<div id="chat">
  <h2>📞 Polizei Ganterbach</h2>
  <div id="messages"></div>
  <input id="input" placeholder="Ihre Frage an die Polizei">
  <button onclick="send()">Senden</button>
  <button onclick="playVoice()">🔊 Antwort anhören</button>
  <button onclick="speak()">🎤 Sprechen</button>
</div>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("input");
let lastPoliceText = "";

// Nachrichten ins Chatfenster
function add(text, cls){
  const d = document.createElement("div");
  d.className = "msg " + (cls || "");
  d.innerText = text;
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
  if(cls === "polizei") lastPoliceText = text;
}

// Witziger Polizist: Antworten generieren
function generateFunnyResponse(userText) {
  const lower = userText.toLowerCase();

  // Beispielhafte Kategorien
  if (lower.includes("pizza") || lower.includes("essen")) {
    return "Als Polizist kann ich leider nicht zum Pizzaessen kommen, aber ich empfehle die Margherita – sauber, klassisch, zuverlässig!";
  }
  if (lower.includes("tanz") || lower.includes("party")) {
    return "Tanzen? Ich habe nur Zeit für Sirenen-Tanz, sehr rhythmisch!";
  }
  if (lower.includes("hund")) {
    return "wir haben leider keinen Hund mehr auf Streife";
  }
  if (lower.includes("katze")) {
    return "Katzen sind schwer zu kontrollieren, da lasse ich lieber die Profis ran.";
  }
  if (lower.includes("urlaub")) {
    return "Urlaub? Haha, brauch ich nicht, arbeite ja schon im Wallis !";
  }

  // Standard-Polizei-Antwort
  const funnyReplies = [
    "Ich notiere das mal in meinem Notizbuch.",
    "Achtung, das klingt nach einem ganz verzwickten Fall",
    "Interessant… das könnte sogar die Polizei von Bern interessieren.",
    "Ich muss Sie leider verwarnen: zu viel Humor, kommt nur im Film bei "Tschugger" gut an.",
    "Das werde ich an meinen Kollegen melden… der Kaffee ist eh alle."
  ];
  return funnyReplies[Math.floor(Math.random() * funnyReplies.length)];
}

// Nachricht senden
function send(){
  const text = input.value.trim();
  if(!text) return;
  add("Du: " + text);
  input.value = "";

  // Witzige Antwort generieren
  const response = generateFunnyResponse(text);
  add("" + response,"polizei");
}

// iOS-optimierte Stimme
function playVoice() {
  if (!lastPoliceText) return;

  const utter = new SpeechSynthesisUtterance(lastPoliceText);
  utter.lang = "de-DE";

  // iOS optimiert: tiefer & langsamer
  utter.pitch = 0.6; // tiefer
  utter.rate = 0.85; // langsamer
  utter.volume = 1;

  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

// Spracheingabe
function speak(){
  if(!("webkitSpeechRecognition" in window)){
    alert("Spracherkennung wird nicht unterstützt.");
    return;
  }
  const r=new webkitSpeechRecognition();
  r.lang="de-DE";
  r.start();
  r.onresult=e=>{
    input.value=e.results[0][0].transcript;
    send();
  };
}
</script>
</body>
</html>
