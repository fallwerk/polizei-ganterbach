<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>📱 Daniel Rieder – Polizei Ganterbach</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  background:#ece5dd;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
  display:flex;
  justify-content:center;
  padding:20px;
}
.phone{
  width:300px;
  height:580px;
  background:#e5ddd5;
  border-radius:30px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.header{
  background:#075e54;
  color:#fff;
  padding:14px;
  font-weight:600;
}
.subheader{
  font-size:12px;
  opacity:0.85;
}
.chat{
  flex:1;
  padding:12px;
  overflow-y:auto;
  background:#efeae2;
}
.msg{
  max-width:80%;
  padding:10px 12px;
  margin:6px 0;
  border-radius:10px;
  font-size:14px;
  line-height:1.4;
}
.user{
  background:#dcf8c6;
  margin-left:auto;
  border-bottom-right-radius:2px;
}
.polizei{
  background:#fff;
  margin-right:auto;
  border-bottom-left-radius:2px;
}
.input{
  display:flex;
  padding:10px;
  background:#f0f0f0;
}
input{
  flex:1;
  padding:10px 14px;
  border-radius:20px;
  border:none;
  outline:none;
}
button{
  margin-left:8px;
  border:none;
  border-radius:50%;
  background:#075e54;
  color:#fff;
  width:40px;
  height:40px;
  font-size:18px;
}
</style>
</head>

<body>

<div class="phone">
  <div class="header">
    Daniel Rieder 👮‍♂️
    <div class="subheader">Regionalpolizei Ganterbach · online</div>
  </div>

  <div id="chat" class="chat"></div>

  <div class="input">
    <input id="input" placeholder="Nachricht schreiben …">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
let voices=[];
speechSynthesis.onvoiceschanged=()=>voices=speechSynthesis.getVoices();

const chat=document.getElementById("chat");
const input=document.getElementById("input");
const asked={};

// Nachricht anzeigen
function add(text,cls){
  const d=document.createElement("div");
  d.className="msg "+cls;
  d.innerText=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  if(cls==="polizei") speak(text);
}

// Funk / Stimme
function speak(text){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE";

  // Bevorzuge deutsche Männerstimmen
  const preferredVoices = [
    "Markus",          // macOS (sehr gut)
    "Google Deutsch",  // Chrome
    "Google Deutsch Male",
    "Microsoft Stefan",
    "Microsoft Markus"
  ];

  const voice = voices.find(v =>
    preferredVoices.some(name => v.name.includes(name))
  ) || voices.find(v => v.lang.startsWith("de"));

  if(voice) u.voice = voice;

  // Stimme tiefer & ruhiger
  u.pitch = 0.6;   // Standard = 1 (tiefer = männlicher)
  u.rate  = 0.8;   // langsamer = autoritärer
  u.volume = 1;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// Personen (nur Funktionen)
const persons={
  "thomas":"Thomas G. Brigger war Podcaster. Thematisch Umwelt, Tourismus und lokale Themen.",
  "brigger":"Thomas G. Brigger war öffentlich sehr präsent.",
  "doris":"Doris Bayard arbeitet in der Verwaltung des Campingplatzes.",
  "bayard":"Doris Bayard ist für Organisation und Abläufe zuständig.",
  "martin nanzer":"Martin Nanzer ist Dauercamper mit handwerklichem Hintergrund.",
  "Nanzer":"Martin Nanzer haltet sich regelmäßig länger am Platz auf.",
  "stefanie":"Stefanie Schnydrig arbeitet im Social-Media-Bereich.",
  "steven":"Steven Amherd lebt zeitweise in einem Van, selbstständig. Schuhverkäufer",
  "Peter":"Peter Jossen war früher Gemeindepolizist.",
  "tina":"Tina Wolf engagiert sich im Naturschutz.",
  "fredy":"Fredy Näfen betreut in seiner Freizeit die technische Anlagen am Campingplatz.",
  "nina":"Nina Bellwald arbeitet an der Rezeption.",
  "hans":"Hans Burri ist in der Region bekannt, oft an der Brücke.",
  "Martin Bellwald":"Martin Bellwald ist politisch aktiv."
};

// Allgemeine Antworten
const general=[
  "Du, dazu hab ich im Moment nichts Verlässliches.",
  "Gute Frage – da wäre ich vorsichtig.",
  "Ich würde das nicht überbewerten.",
  "Lass uns bei den Fakten bleiben.",
  "Schreib ich mir mal auf."
];

// Kontextantworten
const hints={
  verdacht:[
    "Auf einem Campingplatz hat fast jede:r irgendwas gesehen.",
    "Nicht jede Beobachtung ist gleich wichtig.",
    "Manche wirken ruhig, andere nervös – das heißt noch nichts.",
    "Ferien machen Erinnerungen ungenau."
  ],
  ort:[
    "Der Platz ist größer und verwinkelter, als man denkt.",
    "Es gibt viele ruhige Ecken.",
    "Nicht alles ist gut einsehbar.",
    "Der Bach zieht Leute an."
  ],
   Tschüss:[
    "Wir hören uns, viel Erfolg bis dann.",
  ],
  hallo:[
    "ja hallo, wir können gerne zusammen Chatten.",
    "Ja hallo, was gibts?",
  ],
  mord:[
    "Noch nicht sicher, aber sieht fast so aus.",
  ],
  zeit:[
    "Zeitangaben gehen hier ziemlich auseinander.",
    "Viele orientieren sich nicht an der Uhr.",
    "Abends verschwimmt vieles.",
    "Darum müssen wir genau hinschauen. Warten wir mal den Bericht der Forensik von Brig ab."
  ]
};

// Antwortlogik
function respond(q){
  const t=q.toLowerCase();

  for(const k in persons){
    if(t.includes(k)){
      return "Ja, kenn ich. "+persons[k]+" Mehr kann ich dir dazu im Moment nicht sagen. Es sind laufende Ermittlungen und ihr seid an der Front";
    }
  }

  if(t.includes("passwort")){
    return "Dazu kann ich dir nichts sagen. Schau dir doch mal das Hilfe Menu auf unserer Webseite mal in Ruhe an.";
  }

  if(t.includes("wer")||t.includes("verdacht")){
    return hints.verdacht[Math.floor(Math.random()*hints.verdacht.length)];
  }
  if(t.includes("wo")||t.includes("ort")){
    return hints.ort[Math.floor(Math.random()*hints.ort.length)];
  }
  if(t.includes("wann")||t.includes("zeit")){
    return hints.zeit[Math.floor(Math.random()*hints.zeit.length)];
  }

  return general[Math.floor(Math.random()*general.length)];
}

// Senden
function send(){
  const text=input.value.trim();
  if(!text) return;
  input.value="";
  add(text,"user");
  setTimeout(()=>add(respond(text),"polizei"),600);
}
</script>

</body>
</html>
