<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>📱 Daniel Rieder – Polizei Ganterbach</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#ece5dd;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
  display:flex;
  justify-content:center;
  padding:20px;
}
.phone{
  width:290px;
  height:560px;
  background:#e5ddd5;
  border-radius:30px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.header{
  background:#075e54;
  color:#fff;
  padding:14px;
  font-weight:600;
}
.subheader{
  font-size:12px;
  opacity:0.85;
}
.chat{
  flex:1;
  padding:12px;
  overflow-y:auto;
  background:#efeae2;
}
.msg{
  max-width:80%;
  padding:10px 12px;
  margin:6px 0;
  border-radius:10px;
  font-size:14px;
  line-height:1.4;
}
.user{
  background:#dcf8c6;
  margin-left:auto;
  border-bottom-right-radius:2px;
}
.polizei{
  background:#fff;
  margin-right:auto;
  border-bottom-left-radius:2px;
}
.input{
  display:flex;
  padding:10px;
  background:#f0f0f0;
}
input{
  flex:1;
  padding:10px 14px;
  border-radius:20px;
  border:none;
  outline:none;
}
button{
  margin-left:8px;
  border:none;
  border-radius:50%;
  background:#075e54;
  color:#fff;
  width:40px;
  height:40px;
  font-size:18px;
}
.typing{
  font-style:italic;
  opacity:0.8;
}
</style>
</head>

<body>

<div class="phone">
  <div class="header">
    Daniel Rieder 👮‍♂️
    <div id="status" class="subheader">Regionalpolizei Ganterbach · online</div>
  </div>

  <div id="chat" class="chat"></div>

  <div class="input">
    <input id="input" placeholder="Nachricht schreiben …">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
let voices=[];
speechSynthesis.onvoiceschanged=()=>voices=speechSynthesis.getVoices();

const chat=document.getElementById("chat");
const input=document.getElementById("input");
const status=document.getElementById("status");

// ------------------------------
// Beteiligte (nur Rollen)
// ------------------------------
const persons={
  "thomas":"Thomas G. Brigger war Podcaster mit Fokus Umwelt und Tourismus.",
  "brigger":"Thomas G. Brigger war regional bekannt.",
  "doris":"Doris Bayard arbeitet in der Verwaltung des Campingplatzes.",
  "bayard":"Doris Bayard organisiert den Betrieb.",
  "martin nanzer":"Martin Nanzer ist Dauercamper mit handwerklichem Hintergrund.",
  "nanzer":"Martin Nanzer hält sich oft länger am Platz auf.",
  "tina":"Tina Wolf engagiert sich im Naturschutz.",
  "wolf":"Tina Wolf ist häufig rund um den Bach unterwegs.",
  "nina":"Nina Bellwald arbeitet an der Rezeption.",
  "bellwald":"Die Familie Bellwald ist regional bekannt.",
  "martin bellwald":"Martin Bellwald ist politisch aktiv.",
  "peter":"Peter Jossen war früher Gemeindepolizist.",
  "jossen":"Peter Jossen kennt alte Abläufe.",
  "hans":"Hans Burri ist oft bei der Brücke.",
  "burri":"Hans Burri kennt die Gegend gut.",
  "fredy":"Fredy Näfen kümmert sich um die Technik auf dem Campingplatz Ganterbach.",
  "näfen":"Fredy Näfen hilft bei Wartung.",
  "stefanie":"Stefanie Schnydrig arbeitet im Social-Media-Bereich.",
  "schnydrig":"Stefanie Schnydrig kennt sich mit Reichweite aus.",
  "steven":"Steven Amherd lebt zeitweise im Van, selbstständig.",
  "amherd":"Steven Amherd ist nicht dauerhaft gemeldet."
};

// ------------------------------
function add(text,cls){
  const d=document.createElement("div");
  d.className="msg "+cls;
  d.innerText=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  if(cls==="polizei") speak(text);
}

// ------------------------------
function speak(text){
  const u=new SpeechSynthesisUtterance(text);
  u.lang="de-DE";

  const pref=["Markus","Google Deutsch Male","Microsoft Stefan","Microsoft Markus"];
  const v=voices.find(v=>pref.some(p=>v.name.includes(p)))||voices.find(v=>v.lang.startsWith("de"));
  if(v) u.voice=v;

  u.pitch=0.4;
  u.rate=0.65;
  u.volume=1;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// ------------------------------
// Status Handling
// ------------------------------
function setStatus(text){
  status.innerText="Regionalpolizei Ganterbach · "+text;
}

// ------------------------------
// respond()
// ------------------------------
function respond(q){
  const t=q.toLowerCase();

  for(const k in persons){
    if(t.includes(k)){
      return "Ja, kenn ich. "+persons[k]+" Mehr kann ich im Moment nicht sagen. Laufende Ermittlungen.";
    }
  }

  if(t.includes("hallo")||t.includes("hey")) return rand(["Ja hallo.","Gruss."]);
  if(t.includes("danke")) return rand(["Gern geschehen.","Wir Walliser helfen einander."]);
  if(t.includes("tschüss")) return rand(["Bis später.","Meld dich, wenn was ist."]);
  if(t.includes("mord")) return rand(["So weit sind wir offiziell noch nicht.","Findet ihr raus."]);
  if(t.includes("beweis")) return rand(["Einige Spuren, nichts Sicheres.","Wir sichern erst."]);
  if(t.includes("wer")) return rand(["Viele waren vor Ort.","Niemand offiziell."]);
  if(t.includes("wann")||t.includes("zeit")) return rand(["Zeitangaben gehen auseinander."]);
  if(t.includes("passwort")) return "Das läuft nicht über mich. Schau im Hilfe-Bereich.";

  return rand([
    "Dazu hab ich im Moment nichts Verlässliches.",
    "Lass uns bei den Fakten bleiben.",
    "Schreib ich mir auf."
  ]);
}

function rand(a){return a[Math.floor(Math.random()*a.length)];}

// ------------------------------
// Senden
// ------------------------------
function send(){
  const text=input.value.trim();
  if(!text) return;
  input.value="";
  add(text,"user");

  setStatus("tippt…");
  setTimeout(()=>{
    add(respond(text),"polizei");
    setStatus("online");
  },900);
}

// ------------------------------
// Automatische Begrüssung
// ------------------------------
window.onload=()=>{
  setTimeout(()=>{
    add("Hallo zusammen. Daniel Rieder hier. Ich war als Erster vor Ort beim Campingplatz Ganterbach. Wenn ihr Fragen habt – schreibt einfach.","polizei");
  },800);
};
</script>

</body>
</html>
