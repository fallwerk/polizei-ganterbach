<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>📞 Polizei Ganterbach</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background:#222;
  font-family: -apple-system, BlinkMacSystemFont, Arial;
  display:flex;
  justify-content:center;
  padding:20px;
}

.phone {
  width:360px;
  height:640px;
  background:#000;
  border-radius:30px;
  box-shadow:0 0 40px #000;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.header {
  padding:15px;
  text-align:center;
  background:#111;
  color:#9ddcff;
  font-weight:bold;
}

.chat {
  flex:1;
  padding:10px;
  overflow-y:auto;
  background:#0d0d0d;
}

.msg {
  max-width:80%;
  padding:10px;
  margin:8px 0;
  border-radius:12px;
  font-size:14px;
}

.user {
  background:#1e90ff;
  color:white;
  margin-left:auto;
  border-bottom-right-radius:0;
}

.polizei {
  background:#222;
  color:#9ddcff;
  border-bottom-left-radius:0;
}

.input {
  display:flex;
  padding:10px;
  background:#111;
}

input {
  flex:1;
  padding:10px;
  border-radius:20px;
  border:none;
}

button {
  margin-left:6px;
  border-radius:50%;
  border:none;
  padding:10px;
}
</style>
</head>

<body>

<div class="phone">
  <div class="header">📞 Polizei Ganterbach</div>
  <div id="chat" class="chat"></div>
  <div class="input">
    <input id="input" placeholder="Nachricht schreiben…">
    <button onclick="send()">➤</button>
    <button onclick="playVoice()">🔊</button>
  </div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
let history = [];
let lastPoliceText = "";

function add(text, cls){
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerText = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  if(cls === "polizei") lastPoliceText = text;
}

// KRIMI-LOGIK
function crimeResponse(q){
  const t = q.toLowerCase();

  if(t.includes("passwort")){
    return "Oh! schon wieder haben Sie das vergessen.... Schauen Sie sich doch mal das FAQ der Regionalpolizei-Webseite. Da steht oft mehr, als man denkt.";
  }

  if(t.includes("verdächtig") || t.includes("beweise") || t.includes("tatzeit")){
    return "Alle Personen waren zur Tatzeit auf dem Campingplatz. Aussagen und Verhöre finden Sie online. Und glauben Sie mir: Im Wallis ist nicht jeder ruhig, nur weil die Berge still sind.";
  }

  const jokes = [
    "Im Wallis hört man nachts alles. Auch Dinge, die man lieber nicht hören möchte.",
    "Die Berge sind ruhig – Menschen weniger.",
    "Hier oben verläuft sich nicht nur der Nebel.",
    "Ein Mordfall zwischen Kühen und Campingstühlen… glauben Sie mir, ich hätte mir auch einen ruhigeren Dienst gewünscht."
  ];

  return jokes[Math.floor(Math.random()*jokes.length)];
}

async function send(){
  const text = input.value.trim();
  if(!text) return;
  input.value="";
  add(text,"user");
  history.push({role:"user",content:text});

  let answer;

  if(/camping|mord|ganterbach|verdächtig|beweis|tat|passwort/i.test(text)){
    answer = crimeResponse(text);
  } else {
    try {
      const r = await fetch("https://plain-sea-bb50.fallwerk-krimi.workers.dev/",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:history})
      });
      const j = await r.json();
      answer = j.choices[0].message.content;
    } catch {
      answer = "Verbindung fehlgeschlagen. Funkloch im Tal… kommt vor.";
    }
  }

  add(answer,"polizei");
  history.push({role:"assistant",content:answer});
}

// iOS Stimme
function playVoice(){
  if(!lastPoliceText) return;
  const u = new SpeechSynthesisUtterance(lastPoliceText);
  u.lang="de-DE";
  u.pitch=0.6;
  u.rate=0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
</script>

</body>
</html>
