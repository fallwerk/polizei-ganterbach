<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>📞 Polizei Ganterbach</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #eee;
  padding: 20px;
}

#chat {
  max-width: 600px;
  margin: auto;
}

.msg {
  margin: 10px 0;
}

.polizei {
  color: #9ddcff;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  box-sizing: border-box;
}

button {
  padding: 10px;
  margin-top: 10px;
  margin-right: 5px;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="chat">
  <h2>📞 Polizei Ganterbach</h2>
  <div id="messages"></div>

  <input id="input" placeholder="Ihre Frage an die Polizei">
  <button onclick="send()">Senden</button>
  <button onclick="playVoice()">🔊 Antwort anhören</button>
  <button onclick="speak()">🎤 Sprechen</button>
</div>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("input");
let lastPoliceText = "";

function add(text, cls){
  const d = document.createElement("div");
  d.className = "msg " + (cls || "");
  d.innerText = text;
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;

  if(cls === "polizei"){
    lastPoliceText = text;
  }
}

async function send(){
  const text = input.value.trim();
  if(!text) return;

  add("Du: " + text);
  input.value = "";

  try {
    const r = await fetch(
      "https://plain-sea-bb50.fallwerk-krimi.workers.dev/",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: [
            {
              role: "system",
              content: `Du bist Polizeihauptmeister Daniel Rieder von der Polizei Ganterbach.

PHASE 1:
- Nur allgemeine Informationen
- Keine Täter benennen
- Keine Analyse
- Freundlich, aber zurückhaltend
- Häufig auf laufende Ermittlungen verweisen`
            },
            {
              role: "user",
              content: text
            }
          ]
        })
      }
    );

    if (!r.ok) {
      add("❌ Fehler beim Server (" + r.status + ")", "polizei");
      return;
    }

    const j = await r.json();
    add("Weber: " + j.choices[0].message.content, "polizei");

  } catch (e) {
    add("❌ Verbindung fehlgeschlagen", "polizei");
  }
}

  if(!lastPoliceText) return;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
