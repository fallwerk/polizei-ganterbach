<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>📞 Polizei Ganterbach</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial, sans-serif; background:#111; color:#eee; padding:20px; }
#chat { max-width:600px; margin:auto; }
.msg { margin:10px 0; }
.polizei { color:#9ddcff; }
button { padding:10px; margin-top:10px; }
input { width:100%; padding:10px; margin-top:10px; }
</style>
</head>
<body>
<div id="chat">
  <h2>📞 Polizei Ganterbach</h2>
  <div id="messages"></div>
  <input id="input" placeholder="Ihre Frage an die Polizei">
  <button onclick="send()">Senden</button>
  <button onclick="playVoice()">🔊 Antwort anhören</button>
  <button onclick="speak()">🎤 Sprechen</button>
</div>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("input");
let lastPoliceText = "";

// Nachricht hinzufügen
function add(text, cls){
  const d = document.createElement("div");
  d.className = "msg " + (cls || "");
  d.innerText = text;
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
  if(cls === "polizei") lastPoliceText = text;
}

// Nachricht senden
async function send(){
  const text = input.value.trim();
  if(!text) return;
  add("Du: " + text);
  input.value = "";
  try {
    const r = await fetch(
      "https://plain-sea-bb50.fallwerk-krimi.workers.dev/",
      {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body:JSON.stringify({
          messages:[
            {role:"system", content:`Du bist Polizeihauptmeister Sepp Jordan.`},
            {role:"user", content:text}
          ]
        })
      }
    );
    if(!r.ok){ add("❌ Fehler ("+r.status+")","polizei"); return; }
    const j = await r.json();
    add("Jordan: " + j.choices[0].message.content,"polizei");
  } catch(e){
    add("❌ Verbindung fehlgeschlagen","polizei");
  }
}

// Neue Version: Deutsche männliche Stimme, natürlicher Klang
function playVoice() {
  if (!lastPoliceText) return;

  const utter = new SpeechSynthesisUtterance(lastPoliceText);
  utter.lang = "de-DE";

  const speakWithVoice = () => {
    const voices = speechSynthesis.getVoices();

    // Männliche deutsche Stimme bevorzugen
    let voice = voices.find(v =>
      v.lang === "de-DE" && v.name.toLowerCase().includes("male")
    );

    // Fallback: irgendeine deutsche Stimme
    if (!voice) voice = voices.find(v => v.lang === "de-DE") || voices[0];

    utter.voice = voice;

    // Pitch & Rate für natürlicheren Klang
    utter.pitch = 0.8; // tiefer
    utter.rate = 0.95; // etwas langsamer
    utter.volume = 1;

    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  };

  // Stimmen werden oft asynchron geladen
  if (speechSynthesis.getVoices().length === 0) {
    speechSynthesis.onvoiceschanged = () => speakWithVoice();
  } else {
    speakWithVoice();
  }
}

// Spracheingabe
function speak(){
  if(!("webkitSpeechRecognition" in window)){
    alert("Spracherkennung wird nicht unterstützt.");
    return;
  }
  const r=new webkitSpeechRecognition();
  r.lang="de-DE";
  r.start();
  r.onresult=e=>{
    input.value=e.results[0][0].transcript;
    send();
  };
}
</script>

</body>
</html>
