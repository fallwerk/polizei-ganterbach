<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>📞 Polizei Ganterbach</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { background:#222; font-family:-apple-system,BlinkMacSystemFont,Arial; display:flex; justify-content:center; padding:20px; }
.phone { width:330px; height:580px; background:#000; border-radius:30px; box-shadow:0 0 40px #000; display:flex; flex-direction:column; overflow:hidden; }
.header { padding:15px; text-align:center; background:#111; color:#9ddcff; font-weight:bold; }
.chat { flex:1; padding:10px; overflow-y:auto; background:#0d0d0d; }
.msg { max-width:80%; padding:10px; margin:8px 0; border-radius:12px; font-size:14px; }
.user { background:#1e90ff; color:white; margin-left:auto; }
.polizei { background:#222; color:#9ddcff; }
.input { display:flex; padding:10px; background:#111; }
input { flex:1; padding:10px; border-radius:20px; border:none; }
button { margin-left:6px; border-radius:50%; border:none; padding:10px; }
</style>
</head>

<body>
<div class="phone">
  <div class="header">📞 Polizei Ganterbach</div>
  <div id="chat" class="chat"></div>
  <div class="input">
    <input id="input" placeholder="Nachricht schreiben…">
    <button onclick="send()">➤</button>
    <button onclick="playVoice()">🔊</button>
  </div>
</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
let lastPoliceText="";
const askedQuestions={};

function add(text,cls){
  const d=document.createElement("div");
  d.className="msg "+cls;
  d.innerText=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  if(cls==="polizei") lastPoliceText=text;
}

const hints={
  verdächtige:[
    "Es waren auffällig viele Personen zur Tatzeit auf dem Platz.",
    "Nicht jeder Camper war kooperativ.",
    "Ein Verdächtiger behauptete, er sei bei einem Blinddate in Naters gewesen.",
    "Schauen Sie besser in die Unterlagen – wir haben die nicht zum Spaß hochgeladen."
  ],
  beweise:[
    "Beim Opfer lag ein persönliches Tagebuch.",
    "Am Tatort wurde ungewöhnlich viel Müll gefunden.",
    "Die Überwachungskameras waren leider außer Betrieb."
  ],
  tatzeit:[
    "Die Tat geschah vermutlich zwischen später Nachmittag und Abend.",
    "Ein Fischer meldete am Morgen des 12. August 2025 den Fund.",
    "Es war vermutlich bereits dunkel."
  ],
  ort:[
    "Der Campingplatz Ganterbach – ruhig, abgelegen, trügerisch.",
    "Einige Stellplätze waren leer.",
    "Der Zeltplatz liegt etwa sieben Gehminuten entfernt."
  ]
};

function crimeResponse(q){
  const t=q.toLowerCase();
  if(t.includes("passwort")) return "Dazu sage ich nichts. Lesen Sie das FAQ der Webseite – wir sind hier nicht beim Wunschkonzert.";

  let cat="";
  if(t.includes("verdächtig")) cat="verdächtige";
  else if(t.includes("beweis")) cat="beweise";
  else if(t.includes("tatzeit")||t.includes("wann")) cat="tatzeit";
  else if(t.includes("wo")||t.includes("ort")) cat="ort";

  if(cat){
    askedQuestions[cat]=askedQuestions[cat]||0;
    const i=askedQuestions[cat];
    const hint=hints[cat][i]||hints[cat][hints[cat].length-1];
    askedQuestions[cat]=Math.min(i+1,hints[cat].length-1);

    const jokes=[
      "Im Wallis ist selbst der Nebel verdächtig.",
      "Die Berge hören alles – sagen aber nichts.",
      "Zwischen Kühen und Campern passieren seltsame Dinge.",
      "Das Wallis gilt als Paradies… meistens."
    ];
    return hint+" "+jokes[Math.floor(Math.random()*jokes.length)];
  }

  return "Dazu habe ich nichts Aktenkundiges. Konzentrieren wir uns auf den Fall. Sprüche können Sie dann wieder reissen, wenn Sie was geschafft haben";
}

function send(){
  const text=input.value.trim();
  if(!text) return;
  input.value="";
  add(text,"user");
  add(crimeResponse(text),"polizei");
}

function playVoice(){
  if(!lastPoliceText) return;
  const u=new SpeechSynthesisUtterance(lastPoliceText);
  u.lang="de-DE";
  u.pitch=0.6;
  u.rate=0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
</script>
</body>
</html>
